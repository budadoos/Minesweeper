<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minesweeper</title>
<style>
  body {
    font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    background-color: #fafafa;
    margin-top: 30px;
    user-select: none;
  }
  .top-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .stat {
    font-size: 16px;
    font-weight: bold;
    width: 95px;
    text-align: center;
  }
  button.ctrl-btn {
    font-family: inherit;
    font-size: 14px;
    font-weight: bold;
    padding: 6px 12px;
    cursor: pointer;
    border: 2px solid #808080;
    background-color: #e0e0e0;
    border-radius: 4px;
  }
  button.ctrl-btn.active {
    background-color: #ffdddd;
    border-color: #d32f2f;
    color: #d32f2f;
  }
  #board {
    display: grid;
    grid-template-columns: repeat(12, 32px);
    grid-template-rows: repeat(12, 32px);
    border: 3px solid #808080;
    background-color: #d9d9d9;
  }
  .cell {
    width: 32px;
    height: 32px;
    box-sizing: border-box;
    border: 2px outset #ffffff;
    background-color: #d9d9d9;
    font-size: 14px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .cell.revealed {
    border: 1px solid #bdbdbd;
    background-color: #f2f2f2;
    cursor: default;
  }
  .hint {
    margin-top: 10px;
    font-size: 13px;
    color: #555;
  }
  .c1 { color: blue; }
  .c2 { color: green; }
  .c3 { color: red; }
  .c4 { color: darkblue; }
  .c5 { color: darkred; }
  .c6 { color: cyan; }
  .c7 { color: black; }
  .c8 { color: gray; }
</style>
</head>
<body>

  <div class="top-bar">
    <div id="mine-lbl" class="stat">Mines: 20</div>
    <button class="ctrl-btn" onclick="resetGame()">New Game</button>
    <button id="flag-mode-btn" class="ctrl-btn" onclick="toggleFlagMode()">🚩 Flag Mode: OFF</button>
    <div id="time-lbl" class="stat">Time: 0s</div>
  </div>

  <div id="board"></div>
  <div class="hint">Right-click (or toggle Flag Mode) to mark a bomb</div>

<script>
  const ROWS = 12;
  const COLS = 12;
  const MINES = 20;

  let mineSet = new Set();
  let flags = new Set();
  let revealed = new Set();
  let gameOver = false;
  let started = false;
  let flagMode = false;
  let seconds = 0;
  let timerId = null;
  let cells = {};

  const boardEl = document.getElementById("board");
  const mineLbl = document.getElementById("mine-lbl");
  const timeLbl = document.getElementById("time-lbl");
  const flagModeBtn = document.getElementById("flag-mode-btn");

  function key(r, c) {
    return `${r},${c}`;
  }

  function toggleFlagMode() {
    flagMode = !flagMode;
    flagModeBtn.textContent = flagMode ? "🚩 Flag Mode: ON" : "🚩 Flag Mode: OFF";
    flagModeBtn.classList.toggle("active", flagMode);
  }

  function resetGame() {
    clearInterval(timerId);
    boardEl.innerHTML = "";
    mineSet.clear();
    flags.clear();
    revealed.clear();
    cells = {};
    gameOver = false;
    started = false;
    seconds = 0;

    mineLbl.textContent = `Mines: ${MINES}`;
    timeLbl.textContent = "Time: 0s";

    // Place mines randomly across the entire board
    const allCoords = [];
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        allCoords.push([r, c]);
      }
    }
    for (let i = allCoords.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [allCoords[i], allCoords[j]] = [allCoords[j], allCoords[i]];
    }
    for (let i = 0; i < MINES; i++) {
      const [r, c] = allCoords[i];
      mineSet.add(key(r, c));
    }

    // Build grid
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const cell = document.createElement("div");
        cell.className = "cell";
        cell.addEventListener("click", () => {
          if (flagMode) {
            toggleFlag(r, c);
          } else {
            leftClick(r, c);
          }
        });
        cell.addEventListener("contextmenu", (e) => {
          e.preventDefault();
          toggleFlag(r, c);
        });
        boardEl.appendChild(cell);
        cells[key(r, c)] = cell;
      }
    }
  }

  function startTimer() {
    timerId = setInterval(() => {
      if (!gameOver && started) {
        seconds++;
        timeLbl.textContent = `Time: ${seconds}s`;
      }
    }, 1000);
  }

  function getNeighbors(r, c) {
    const result = [];
    for (let nr = r - 1; nr <= r + 1; nr++) {
      for (let nc = c - 1; nc <= c + 1; nc++) {
        if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && (nr !== r || nc !== c)) {
          result.push([nr, nc]);
        }
      }
    }
    return result;
  }

  function leftClick(r, c) {
    const k = key(r, c);
    if (gameOver || flags.has(k) || revealed.has(k)) return;

    if (!started) {
      started = true;
      startTimer();
    }

    if (mineSet.has(k)) {
      endGame(false);
      return;
    }

    reveal(r, c);

    if (revealed.size === ROWS * COLS - MINES) {
      endGame(true);
    }
  }

  function reveal(r, c) {
    const k = key(r, c);
    if (revealed.has(k) || flags.has(k)) return;

    revealed.add(k);
    const neighbors = getNeighbors(r, c);
    const count = neighbors.filter(([nr, nc]) => mineSet.has(key(nr, nc))).length;

    const cell = cells[k];
    cell.classList.add("revealed");
    if (count > 0) {
      cell.textContent = count;
      cell.classList.add(`c${count}`);
    } else {
      for (const [nr, nc] of neighbors) {
        reveal(nr, nc);
      }
    }
  }

  function toggleFlag(r, c) {
    const k = key(r, c);
    if (gameOver || revealed.has(k)) return;

    const cell = cells[k];
    if (flags.has(k)) {
      flags.delete(k);
      cell.textContent = "";
    } else {
      flags.add(k);
      cell.textContent = "🚩";
    }
    mineLbl.textContent = `Mines: ${MINES - flags.size}`;
  }

  function endGame(won) {
    gameOver = true;
    clearInterval(timerId);
    for (const m of mineSet) {
      const cell = cells[m];
      cell.textContent = "💣";
      cell.style.backgroundColor = won ? "#90ee90" : "#ff6b6b";
    }
    setTimeout(() => {
      alert(won ? `You Won in ${seconds}s!` : "Boom! Game Over.");
    }, 50);
  }

  resetGame();
</script>
</body>
</html>
